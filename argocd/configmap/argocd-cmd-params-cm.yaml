apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
  reposerver.disable.tls: "true"
  # Ineffective on its own - the repo-server binary's --client-ca-path flag
  # defaults to a non-empty path regardless of this env var, which conflicts
  # with disable-tls at startup. scripts/argocd-install.sh patches the
  # deployment's container args directly to actually clear it.
  reposerver.client.ca.path: ""
  controller.repo.server.plaintext: "true"
  # Same fix as the controller - argocd-server and applicationset-controller
  # each have their own repo-server client and their own plaintext flag.
  # Missing these causes "tls: first record does not look like a TLS
  # handshake" whenever that component talks to repo-server (e.g. browsing
  # a project/app in the UI).
  server.repo.server.plaintext: "true"
  applicationsetcontroller.repo.server.plaintext: "true"
