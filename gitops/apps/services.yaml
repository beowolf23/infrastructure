apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/manifest-generate-paths: /gitops/services
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # This is the app-of-apps parent, not a workload - it needs to create
  # child Application CRs in the argocd namespace, which the (tightly
  # scoped, services-namespace-only) services project doesn't allow. The
  # children it generates use project: services themselves.
  project: platform
  source:
    repoURL: https://github.com/beowolf23/infrastructure.git
    targetRevision: main
    path: gitops/services
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # Starts empty until the first service is onboarded (e.g. via the
      # Backstage template) - unlike platform, an empty result here is
      # expected, not a sign something broke.
      allowEmpty: true
