apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: /gitops/services
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  source:
    repoURL: https://github.com/beowolf23/infrastructure.git
    targetRevision: main
    path: gitops/services
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true       # a new service appears as soon as its file lands
      selfHeal: false   # leaf apps choose their own drift policy
      allowEmpty: false
