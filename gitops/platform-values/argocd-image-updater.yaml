# One central component replacing per-repo CI write-back: it polls ghcr.io
# for each service's newest sha-<commit> tag and commits it into
# gitops/services-values/<name>.yaml itself. Per-service config lives in an
# ImageUpdater CR generated by the spring-boot-service Backstage template,
# alongside that service's Application - see
# spring-boot-template/gitops-registration/.
config:
  git.user: "argocd-image-updater"
  git.email: "argocd-image-updater@users.noreply.github.com"
  registries:
    - name: GHCR
      api_url: https://ghcr.io
      prefix: ghcr.io
      ping: true
      # Requires a ghcr-pull secret (kubernetes.io/dockerconfigjson) in the
      # argocd namespace - same PAT/pattern as the backstage and services
      # namespaces' pull secrets, just also needed here for listing tags,
      # not only pulling images.
      credentials: pullsecret:argocd/ghcr-pull
