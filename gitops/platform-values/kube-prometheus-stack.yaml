# Minimal stack: Prometheus + Grafana only. Alertmanager, node-exporter and
# kube-state-metrics are disabled — re-enable by removing their `enabled: false`.
grafana:
  enabled: true
  # No existingSecret: external-secrets isn't deployed, so Grafana
  # auto-generates its own admin credentials (default user "admin",
  # random password in the kube-prometheus-stack-grafana secret).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: monitoring
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        # Lets a log line's trace_id field link to the matching trace in
        # Tempo. Our logs carry trace_id as a queryable field (from the
        # OTel Logback appender), not embedded in the message text, so
        # this has to be a label-type matcher, not a regex-on-raw-text one.
        derivedFields:
          - datasourceUid: tempo
            matcherType: label
            matcherRegex: trace_id
            name: TraceID
            url: "$${__value.raw}"
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-2s"
          spanEndTimeShift: "2s"
          filterByTraceID: true
          filterBySpanID: false
        serviceMap:
          datasourceUid: prometheus
  # dashboards: alone does nothing - the chart requires this too, wiring
  # Grafana's own provisioning config to actually load whatever lands in
  # /var/lib/grafana/dashboards/<provider>/.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  # One shared, variable-driven dashboard covering every service in the
  # services namespace - no per-service dashboard generation needed, new
  # services just show up in the "service" picker automatically. This is
  # the source of truth for the dashboard JSON - Helm values can't include
  # an external file's content, so it has to live inline here.
  dashboards:
    default:
      spring-boot-service:
        json: |
          {
            "title": "Spring Boot Service",
            "uid": "spring-boot-service",
            "tags": ["spring-boot", "otel"],
            "schemaVersion": 39,
            "timezone": "browser",
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s",
            "templating": {
              "list": [
                {
                  "name": "datasource_prometheus",
                  "label": "Prometheus",
                  "type": "datasource",
                  "query": "prometheus",
                  "refresh": 1,
                  "current": {}
                },
                {
                  "name": "datasource_loki",
                  "label": "Loki",
                  "type": "datasource",
                  "query": "loki",
                  "refresh": 1,
                  "current": {}
                },
                {
                  "name": "datasource_tempo",
                  "label": "Tempo",
                  "type": "datasource",
                  "query": "tempo",
                  "refresh": 1,
                  "current": {}
                },
                {
                  "name": "service",
                  "label": "Service",
                  "type": "query",
                  "datasource": { "type": "prometheus", "uid": "${datasource_prometheus}" },
                  "query": { "query": "label_values(jvm_memory_used_bytes, job)", "refId": "service" },
                  "regex": "/services\\/(.+)/",
                  "refresh": 2,
                  "sort": 1,
                  "multi": false,
                  "includeAll": false,
                  "current": {}
                }
              ]
            },
            "panels": [
              { "type": "row", "title": "HTTP", "id": 100, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "collapsed": false, "panels": [] },
              {
                "id": 1,
                "type": "timeseries",
                "title": "Request rate by route",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
                "datasource": { "type": "prometheus", "uid": "${datasource_prometheus}" },
                "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count{job=\"services/$service\"}[5m]))",
                    "legendFormat": "{{http_route}}"
                  }
                ]
              },
              {
                "id": 2,
                "type": "timeseries",
                "title": "Error rate (5xx)",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
                "datasource": { "type": "prometheus", "uid": "${datasource_prometheus}" },
                "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(rate(http_server_request_duration_seconds_count{job=\"services/$service\", http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{job=\"services/$service\"}[5m]))",
                    "legendFormat": "error rate"
                  }
                ]
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "Request latency (p50 / p95 / p99)",
                "gridPos": { "h": 8, "w": 24, "x": 0, "y": 9 },
                "datasource": { "type": "prometheus", "uid": "${datasource_prometheus}" },
                "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_seconds_bucket{job=\"services/$service\"}[5m])))",
                    "legendFormat": "p50"
                  },
                  {
                    "refId": "B",
                    "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job=\"services/$service\"}[5m])))",
                    "legendFormat": "p95"
                  },
                  {
                    "refId": "C",
                    "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job=\"services/$service\"}[5m])))",
                    "legendFormat": "p99"
                  }
                ]
              },
              { "type": "row", "title": "JVM", "id": 200, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 }, "collapsed": false, "panels": [] },
              {
                "id": 4,
                "type": "timeseries",
                "title": "Heap used vs. limit",
                "gridPos": { "h": 8, "w": 8, "x": 0, "y": 18 },
                "datasource": { "type": "prometheus", "uid": "${datasource_prometheus}" },
                "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(jvm_memory_used_bytes{job=\"services/$service\", jvm_memory_type=\"heap\"})",
                    "legendFormat": "used"
                  },
                  {
                    "refId": "B",
                    "expr": "sum(jvm_memory_limit_bytes{job=\"services/$service\", jvm_memory_type=\"heap\"})",
                    "legendFormat": "limit"
                  }
                ]
              },
              {
                "id": 5,
                "type": "timeseries",
                "title": "GC time",
                "gridPos": { "h": 8, "w": 8, "x": 8, "y": 18 },
                "datasource": { "type": "prometheus", "uid": "${datasource_prometheus}" },
                "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum by (jvm_gc_name) (rate(jvm_gc_duration_seconds_sum{job=\"services/$service\"}[5m]))",
                    "legendFormat": "{{jvm_gc_name}}"
                  }
                ]
              },
              {
                "id": 6,
                "type": "timeseries",
                "title": "Thread count",
                "gridPos": { "h": 8, "w": 8, "x": 16, "y": 18 },
                "datasource": { "type": "prometheus", "uid": "${datasource_prometheus}" },
                "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum(jvm_thread_count{job=\"services/$service\"})",
                    "legendFormat": "threads"
                  }
                ]
              },
              { "type": "row", "title": "Logs", "id": 300, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 }, "collapsed": false, "panels": [] },
              {
                "id": 7,
                "type": "logs",
                "title": "Logs",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 27 },
                "datasource": { "type": "loki", "uid": "${datasource_loki}" },
                "options": {
                  "showTime": true,
                  "showLabels": false,
                  "wrapLogMessages": true,
                  "sortOrder": "Descending"
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "{service_name=\"$service\"} | severity_text != \"\""
                  }
                ]
              },
              { "type": "row", "title": "Traces", "id": 400, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 37 }, "collapsed": false, "panels": [] },
              {
                "id": 8,
                "type": "traces",
                "title": "Recent traces (click a row to open the waterfall)",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 38 },
                "datasource": { "type": "tempo", "uid": "${datasource_tempo}" },
                "targets": [
                  {
                    "refId": "A",
                    "queryType": "traceql",
                    "query": "{resource.service.name=\"$service\"} | select(status)",
                    "tableType": "traces",
                    "limit": 20
                  }
                ]
              }
            ]
          }

prometheus:
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # Lets the otel-collector push metrics straight to
    # /api/v1/otlp/v1/metrics instead of Prometheus scraping it.
    enableFeatures:
      - otlp-write-receiver
    # Separate from the OTLP path above - this is Prometheus's classic
    # remote_write receiver (/api/v1/write), which is what Tempo's
    # metrics-generator speaks (see tempo.yaml's tempo.metricsGenerator).
    enableRemoteWriteReceiver: true
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: false

# These two conditions live on the parent chart (camelCase), separate from
# the kube-state-metrics:/prometheus-node-exporter: subchart passthrough
# blocks, which have no enabled field of their own.
kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false
