# Minimal stack: Prometheus + Grafana only. Alertmanager, node-exporter and
# kube-state-metrics are disabled — re-enable by removing their `enabled: false`.
grafana:
  enabled: true
  # No existingSecret: external-secrets isn't deployed, so Grafana
  # auto-generates its own admin credentials (default user "admin",
  # random password in the kube-prometheus-stack-grafana secret).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: monitoring
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local

prometheus:
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # Lets the otel-collector push metrics straight to
    # /api/v1/otlp/v1/metrics instead of Prometheus scraping it.
    enableFeatures:
      - otlp-write-receiver
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: false

# These two conditions live on the parent chart (camelCase), separate from
# the kube-state-metrics:/prometheus-node-exporter: subchart passthrough
# blocks, which have no enabled field of their own.
kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false
