# Minimal stack: Prometheus + Grafana only. Alertmanager, node-exporter and
# kube-state-metrics are disabled — re-enable by removing their `enabled: false`.
grafana:
  enabled: true
  # No existingSecret: external-secrets isn't deployed, so Grafana
  # auto-generates its own admin credentials (default user "admin",
  # random password in the kube-prometheus-stack-grafana secret).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: monitoring

prometheus:
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false
