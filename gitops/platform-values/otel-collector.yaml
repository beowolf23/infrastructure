# Metrics + logs + traces bridge: apps push OTLP here, this forwards
# metrics to Prometheus's native OTLP receiver, logs to Loki's native
# OTLP endpoint, and traces to Tempo's native OTLP gRPC receiver. No
# ServiceMonitor, no per-app scrape config, no log-shipping DaemonSet.
mode: deployment
replicaCount: 1

# Without this, Helm names the Service <release>-<chart>, i.e.
# otel-collector-opentelemetry-collector - not otel-collector, which is
# what the spring-boot-app chart's OTEL_EXPORTER_OTLP_ENDPOINT default
# points at. Every service that ever shipped metrics/logs before this fix
# was silently failing with UnknownHostException.
fullnameOverride: otel-collector

# Core distro - smallest image, has everything this config uses
# (otlp receiver, otlphttp exporter, batch/memory_limiter, health_check).
image:
  repository: otel/opentelemetry-collector
command:
  name: otelcol

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Only OTLP is actually configured below - the chart exposes jaeger/zipkin
# ports by default regardless of config.receivers, so turn them off here too.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    # Not used - drop them so the collector doesn't fail its "defined but
    # unused" validation.
    jaeger: null
    zipkin: null
    prometheus: null
  exporters:
    debug: null
    otlp_http/prometheus:
      endpoint: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp
    otlp_http/loki:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp
    # Tempo's OTLP receiver is native gRPC, not an HTTP path like
    # Prometheus/Loki's - plain otlp exporter, not otlp_http. Its endpoint
    # is bare host:port, no scheme - a URL prefix here is a config error
    # (unlike the otlp_http exporters above, which do need a full URL).
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/loki]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
