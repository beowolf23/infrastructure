# The grafana/tempo chart (single-binary mode) is marked deprecated
# upstream, with grafana/tempo-distributed as the suggested replacement -
# but that chart is microservices-only (distributor/ingester/querier/
# compactor as separate deployments, no single-binary option), overkill
# for one node. This still works fine and fits the "simple, single-node"
# pattern the rest of this cluster uses; revisit if it's ever actually
# pulled rather than just unmaintained.
#
# Filesystem-backed storage (backend: local, the chart default) - no
# minio/S3 needed unlike Loki's chart. OTLP receiver is on by default
# (4317/4318).
fullnameOverride: tempo

persistence:
  enabled: true
  size: 10Gi

tempo:
  # Turns received spans into RED metrics (request rate/errors/duration per
  # edge) and pushes them to Prometheus - this is what actually populates
  # the "Service Graph" tab Grafana shows when you open a trace (wired via
  # the Tempo datasource's serviceMap.datasourceUid in
  # kube-prometheus-stack.yaml). Without this the tab is just empty - it
  # isn't derived from raw spans by Grafana, Tempo has to generate it.
  metricsGenerator:
    enabled: true
    # Prometheus's classic remote_write endpoint - separate from the
    # otlp-write-receiver already enabled for the collector's metrics
    # pipeline. Requires prometheus.prometheusSpec.enableRemoteWriteReceiver
    # in kube-prometheus-stack.yaml, since remote_write isn't the same
    # feature as the OTLP write path.
    remoteWriteUrl: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
  # Enabling metricsGenerator above only starts the component - it still
  # needs to be turned on for spans to actually be routed to it.
  # span-metrics gives per-service/route RED metrics; service-graphs gives
  # the caller->callee edges for the Service Graph tab.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
