name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  build-push-image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # report only - flip to "1" once findings are triaged

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  update-gitops:
    needs: build-push-image
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN only has write access to *this* repo - pushing to
      # infrastructure needs a PAT with repo scope, added by hand as a
      # secret on this repo (see spring-boot-template/README.md).
      - uses: actions/checkout@v4
        with:
          repository: beowolf23/infrastructure
          token: ${{ secrets.GITOPS_DEPLOY_TOKEN }}

      - name: Pin the new image tag
        run: |
          sed -i "s|tag: .*|tag: sha-${GITHUB_SHA}|" \
            "gitops/services-values/${{ github.event.repository.name }}.yaml"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "gitops/services-values/${{ github.event.repository.name }}.yaml"
          git diff --cached --quiet && exit 0
          git commit -m "Deploy ${{ github.event.repository.name }} sha-${GITHUB_SHA}"
          # Other services' CI can push to main around the same time -
          # rebase and retry a few times rather than failing outright.
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push to infrastructure main after 5 attempts"
          exit 1
